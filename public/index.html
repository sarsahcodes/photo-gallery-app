<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 5 Photo Gallery</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { padding: 24px; text-align:center; border-bottom:1px solid #334155; }
    header h1 { margin:0; font-size:1.6rem; }
    header p { margin:6px 0 0; color: var(--muted); font-size:.9rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px; }
    form { background: var(--card); padding:20px; border-radius:12px; display:grid; gap:12px;
           margin-bottom: 28px; }
    input, textarea, button { font: inherit; padding:10px 12px; border-radius:8px; border:1px solid #334155;
           background:#0b1220; color: var(--text); }
    button { background: var(--accent); color:#04222e; border:none; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
    .photo { background: var(--card); border-radius:12px; overflow:hidden; }
    .photo img { width:100%; height:180px; object-fit:cover; display:block; background:#0b1220; }
    .photo .desc { padding:10px 12px; font-size:.9rem; color: var(--text); }
    .photo .date { padding:0 12px 12px; font-size:.75rem; color: var(--muted); }
    .empty { color: var(--muted); text-align:center; padding:40px; }
    .status { font-size:.85rem; color: var(--muted); min-height:1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>📸 Photo Gallery</h1>
    <p>Upload photos with descriptions — stored in S3, served via CloudFront.</p>
  </header>
  <main>
    <form id="uploadForm">
      <input type="file" id="image" name="image" accept="image/*" required />
      <textarea id="description" name="description" rows="2" placeholder="Description..."></textarea>
      <button type="submit" id="submitBtn">Upload</button>
      <div class="status" id="status"></div>
    </form>
    <div class="grid" id="gallery"></div>
    <div class="empty" id="empty" hidden>No photos yet. Be the first to upload!</div>
  </main>

  <script>
    const gallery = document.getElementById("gallery");
    const empty = document.getElementById("empty");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("uploadForm");
    const submitBtn = document.getElementById("submitBtn");

    function render(photos) {
      gallery.innerHTML = "";
      empty.hidden = photos.length > 0;
      for (const p of photos) {
        const el = document.createElement("div");
        el.className = "photo";
        el.innerHTML =
          '<img src="' + p.url + '" alt="" loading="lazy" />' +
          '<div class="desc">' + (p.description ? escapeHtml(p.description) : "<em>No description</em>") + "</div>" +
          '<div class="date">' + new Date(p.createdAt).toLocaleString() + "</div>";
        gallery.appendChild(el);
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    async function load() {
      try {
        const res = await fetch("/api/photos");
        render(await res.json());
      } catch (e) { statusEl.textContent = "Could not load photos."; }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = "Uploading...";
      try {
        const data = new FormData(form);
        const res = await fetch("/api/photos", { method: "POST", body: data });
        if (!res.ok) throw new Error((await res.json()).error || "Upload failed");
        statusEl.textContent = "Uploaded!";
        form.reset();
        await load();
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
        setTimeout(() => (statusEl.textContent = ""), 3000);
      }
    });

    load();
  </script>
</body>
</html>
